[project]
name = "browser-agent"
version = "0.1.0"
description = "A Playwright browser agent over MiniWoB++ with five pluggable observation encoders, and what each encoder throws away."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hammas" }]
dependencies = [
    "playwright>=1.49",
    "tokenizers>=0.20",
]

[project.scripts]
browser-agent = "browser_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.16.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["browser: needs the Playwright Chromium build (skipped when it is not installed)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
